name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: vlang/setup-v@v1.7
        with:
          version: 952e09c9a2e9b3ae0df17c3b6b598cb06bbf95fc
          cache: true
      - run: v fmt -verify .
      - run: v vet .
      - run: v vet ./trashcli ./internal/sqlite ./internal/fsx ./internal/pathx ./internal/errs ./internal/format
      - run: v vet scripts/
      - run: v test .
      - run: v -prod test .
      - run: v run scripts/update_sqlite.vsh --check
      - name: Build (timed)
        run: time v -prod -o /tmp/trash ./cmd/trash
      - run: if command -v mandoc >/dev/null; then mandoc -Tlint trash.1; fi
      - run: v run scripts/concurrency_test.vsh /tmp/trash
      - run: v run scripts/stress_test.vsh /tmp/trash
      - run: v run scripts/cross_device_test.vsh /tmp/trash

  release-binaries:
    if: github.event_name == 'release'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-amd64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.7
        with:
          version: 952e09c9a2e9b3ae0df17c3b6b598cb06bbf95fc
          cache: true
      - name: Verify tag matches the declared app version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n "s/^pub const app_version = '\(.*\)'$/\1/p" constants.v)"
          mod_version="$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\(.*\)'$/\1/p" v.mod)"
          if [ -z "$app_version" ] || [ -z "$mod_version" ]; then
            echo "::error::could not read app_version from constants.v or v.mod"
            exit 1
          fi
          if [ "$tag_version" != "$app_version" ] || [ "$tag_version" != "$mod_version" ]; then
            echo "::error::tag v${tag_version} does not match constants.v (${app_version}) and v.mod (${mod_version})"
            exit 1
          fi
      - name: Build and package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="trash-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}/completions"
          v -prod -o trash ./cmd/trash
          cp trash "dist/${name}/"
          cp trash.1 LICENSE README.md "dist/${name}/"
          cp completions/* "dist/${name}/completions/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz | sort -k2 > checksums.txt
          cat checksums.txt
      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
